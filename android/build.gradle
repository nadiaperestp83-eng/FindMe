allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

// === WORKAROUND: injeta namespace em plugins legados sem namespace (AGP 8.x) ===
// Usa gradle.projectsEvaluated porque no formato moderno do Flutter
// (flutter-plugin-loader no settings.gradle) os subprojetos já são
// avaliados antes do build.gradle raiz ser processado.
gradle.projectsEvaluated {
    rootProject.subprojects { project ->
        if (project.hasProperty("android")) {
            project.android {
                if (namespace == null || namespace.isEmpty()) {
                    // Tenta extrair do AndroidManifest.xml do plugin
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifestText = manifestFile.text
                        def matcher = manifestText =~ /package="([^"]+)"/
                        if (matcher.find()) {
                            namespace = matcher.group(1)
                        }
                    }
                    // Fallback: usa o group do projeto
                    if (namespace == null || namespace.isEmpty()) {
                        namespace = project.group ?: project.name
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
