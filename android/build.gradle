ext.flutter = [
    compileSdkVersion: 35,
    minSdkVersion    : 24,
    targetSdkVersion : 35,
    ndkVersion       : "27.0.12077973"
]

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    // INJEÇÃO: copia a propriedade flutter para cada subprojeto
    // Plugins do pub.dev esperam encontrar flutter.compileSdkVersion
    ext.flutter = rootProject.ext.flutter
    
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
