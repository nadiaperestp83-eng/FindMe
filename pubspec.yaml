  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  app_settings: ^5.1.1
  supabase_flutter: ^2.5.4
  flutter_polyline_points: ^2.0.0
  flutter_screenutil: ^5.9.3
  badges: ^3.1.2
  hive: ^2.2.3
