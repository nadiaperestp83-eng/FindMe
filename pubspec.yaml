name: quickstep_app
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  salomon_bottom_bar: ^3.3.1
  google_maps_flutter: ^2.6.0
  location: ^5.0.3
  geolocator: ^11.0.0
  flutter_background_service: ^5.0.6
  
  # Versão anterior estável que não exige o AGP 8+ restritivo no subprojeto Android
