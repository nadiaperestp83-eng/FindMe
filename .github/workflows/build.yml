name: Build Android APK (arm64)

# Roda em todo push e pull request para main e develop.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Permite disparar manualmente pela aba Actions do GitHub também.
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (release, arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Atualizado para 'latest' para garantir compatibilidade total com os plugins modernos de BLE
          flutter-version: 'latest'
          cache: true

      - name: Limpar cache do pub para evitar versões antigas presas
        run: flutter pub cache clean -f

      - name: Instalar dependências (flutter pub get)
        run: flutter pub get

      - name: Gerar assets/dotenv/.env a partir dos Secrets
        run: |
          mkdir -p assets/dotenv
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          } > assets/dotenv/.env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build APK release (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload do artefato APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

  build-apk-debug:
    name: Build APK (debug, arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Atualizado para 'latest' para compilar o subprojeto Android moderno sem erros
          flutter-version: 'latest'
          cache: true

      - name: Limpar cache do pub para evitar versões antigas presas
        run: flutter pub cache clean -f

      - name: Instalar dependências (flutter pub get)
        run: flutter pub get

      - name: Gerar assets/dotenv/.env a partir dos Secrets
        run: |
          mkdir -p assets/dotenv
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          } > assets/dotenv/.env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build APK debug (arm64-v8a)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload do artefato APK debug
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
